########################################################################
# QUICK CHEATSHEET — CONTEXTS & EXPRESSIONS
########################################################################
# ${{ github.ref }}          -> refs/heads/main
# ${{ github.sha }}          -> commit hash
# ${{ github.actor }}        -> workflow trigger karne wala user
# ${{ github.event_name }}   -> push / pull_request / workflow_dispatch
# ${{ runner.os }}           -> Linux / Windows / macOS
# ${{ secrets.NAME }}        -> repo/org secrets
# ${{ vars.NAME }}           -> repo/org variables (non-secret)
# ${{ needs.<job>.outputs.x }} -> dusre job ka output
# ${{ steps.<id>.outputs.x }}  -> dusre step ka output
# success() / failure() / always() / cancelled()  -> job/step conditions

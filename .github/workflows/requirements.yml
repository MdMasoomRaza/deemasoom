name: My 2nd Workflow # Workflow ka naam (Actions tab mein dikhta hai)
on: push # Trigger: jab bhi koi push ho

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13' # Specify your desired Python version
          cache: 'pip'           # Speeds up subsequent runs by caching dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


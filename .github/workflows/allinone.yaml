
name: Master GitHub Actions Practice Pipeline

# 1. TRIGGERS: Yeh batata hai ki pipeline kab-kab chalegi
on:
  push:
    branches: [ dev, uat, main ]
  pull_request:
    branches: [ dev, main ]
  workflow_dispatch: # Isse aap GitHub UI se manually 'Run workflow' button dabakar chala sakte hain!

# Global Environment Variables (Jo saare jobs me use ho sakte hain)
env:
  APP_NAME: "MyAwesomeApp"
  PYTHON_VERSION: "3.10"

jobs:
  # -------------------------------------------------------------
  # JOB 1: Setup, Linting & Testing (Matrix Strategy ke sath)
  # -------------------------------------------------------------
  code-quality-and-tests:
    name: Code Quality (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    
    # Matrix Strategy: Ek hi job ko alag-alag versions par parallel chalane ke liye
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout Code (Git Clone)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Dependencies & Run Tests
        run: |
          echo "Installing dependencies for Python ${{ matrix.python }}..."
          python -m pip install --upgrade pip
          # pip install -r requirements.txt (Agar file hogi toh chal jayegi)
          echo "Running pytest unit tests..."
          python -c "print('Unit tests passed successfully!')"

  # -------------------------------------------------------------
  # JOB 2: Build & Artifact Generation (Depends on Job 1)
  # -------------------------------------------------------------
  build-artifact:
    name: Build & Package App
    needs: code-quality-and-tests # Jab tak Job 1 pass nahi hoga, ye nahi chalega
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Build Folder and File
        run: |
          mkdir -p build
          echo "App Version: ${{ github.sha }}" > build/version.txt
          echo "Build artifact generated successfully!"

      - name: Upload Build Artifact (Save file for future jobs)
        uses: actions/upload-artifact@v4
        with:
          name: app-build-artifact
          path: build/

  # -------------------------------------------------------------
  # Job 3: Conditional Environment Deployment (Dev, Uat, Prod)
  # -------------------------------------------------------------
  deploy-environment:
    name: Multi-Environment Deployment
    needs: build-artifact
    runs-on: ubuntu-latest

    # Dynamic Environment selection based on branch name
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || (github.ref_name == 'uat' && 'staging' || 'development') }}

    steps:
      - name: Download Artifact from Previous Job
        uses: actions/download-artifact@v4
        with:
          name: app-build-artifact
          path: downloaded-build/

      - name: Execute Deployment Based on Branch
        run: |
          echo "----------------------------------------"
          echo "🚀 Starting Deployment Process..."
          echo "Application Name: ${{ env.APP_NAME }}"
          echo "Target Branch: ${{ github.ref_name }}"
          echo "Triggered By Event: ${{ github.event_name }}"
          
          if [ "${{ github.ref_name }}" == "dev" ]; then
            echo "📦 Deploying to DEV servers..."
          elif [ "${{ github.ref_name }}" == "uat" ]; then
            echo "🧪 Deploying to UAT servers..."
          elif [ "${{ github.ref_name }}" == "main" ]; then
            echo "🔥 Deploying to PRODUCTION servers..."
          else
            echo "🎛️ Manual or custom trigger deployment."
          fi
          echo "----------------------------------------"
